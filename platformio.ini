; ==============================================================================
;  AI-Powered Smart Cold-Chain Monitoring System
;  PlatformIO project configuration
;
;  Two build environments are provided:
;
;    esp32dev-demo  -> DEMO_MODE=1  : simulated sensor providers, no hardware
;                                     required. Safe to flash on a bare ESP32.
;    esp32dev-real  -> DEMO_MODE=0  : real sensor drivers (DHT11, MPU6050,
;                                     NEO-6M, MicroSD) on the documented pins.
;
;  Build a specific environment:
;      pio run -e esp32dev-demo
;      pio run -e esp32dev-real -t upload
;
;  See docs/demo-mode.md for what each mode does.
; ==============================================================================

[platformio]
default_envs = esp32dev-demo
src_dir      = src
include_dir  = include

; ------------------------------------------------------------------------------
; Shared settings inherited by every environment below.
; ------------------------------------------------------------------------------
[env]
platform         = espressif32
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
upload_speed     = 921600

; Allow #include "sensors/DHT11Sensor.h" style paths from anywhere in src/.
build_flags =
    -I src
    -Wall

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit MPU6050 @ ^2.2.6
    mikalhart/TinyGPSPlus @ ^1.1.0

; ------------------------------------------------------------------------------
; DEMO / SIMULATION build  (default)
; ------------------------------------------------------------------------------
[env:esp32dev-demo]
build_flags =
    ${env.build_flags}
    -D DEMO_MODE=1

; ------------------------------------------------------------------------------
; REAL HARDWARE build
; ------------------------------------------------------------------------------
[env:esp32dev-real]
build_flags =
    ${env.build_flags}
    -D DEMO_MODE=0
